<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MissionInjector Task Queue</title>
  <script type="module" src="/firebase-config.js"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * {
      border-radius: 0px !important;
      box-shadow: none !important;
      text-shadow: none !important;
      transition: none !important;
      animation: none !important;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
      border: 1px solid #262626;
    }
    ::-webkit-scrollbar-thumb {
      background: #404040;
    }
  </style>
</head>
<body class="bg-black text-neutral-300 font-mono antialiased p-4 select-none min-h-screen flex flex-col justify-center">

  <div id="root" class="max-w-7xl mx-auto w-full bg-black border border-neutral-800 p-6 flex flex-col">
    
    <!-- Header -->
    <header class="border-b border-neutral-800 pb-4 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <div>
        <div class="flex items-center gap-4">
          <h1 class="text-xl font-bold tracking-tight text-white uppercase">
            MISSION INJECTOR CONTROL
          </h1>
          <a href="/" class="text-xs border border-neutral-700 text-neutral-300 px-3 py-1 hover:bg-neutral-900 uppercase font-bold">
            &larr; BACK TO MONITOR
          </a>
        </div>
        <p class="text-xs text-neutral-500 uppercase mt-1">
          SWARM TASK QUEUEING SYSTEM / SIH26123
        </p>
      </div>
      <div id="statusBadge" class="text-xs px-3 py-1 bg-neutral-950 border border-neutral-800 text-neutral-400 uppercase">
        MODE: PICKUP SELECTION
      </div>
    </header>

    <!-- Main 3-Column Layout: Left (From), Middle (To), Right (Task Script Log) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- LEFT COLUMN: 'From' Grid -->
      <div id="fromColumn" class="lg:col-span-4 bg-neutral-950 border border-neutral-500 p-4 flex flex-col h-[580px]">
        <div class="flex justify-between items-center border-b border-neutral-800 pb-2 mb-3">
          <span class="text-xs font-bold uppercase text-white">
            FROM: PICKUP BAY
          </span>
          <span id="fromBadge" class="text-[10px] px-2 py-0.5 uppercase border border-neutral-600 text-white bg-neutral-900">
            READY
          </span>
        </div>

        <div id="fromGrid" class="grid grid-cols-2 gap-2 overflow-y-auto flex-1 pr-1">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- MIDDLE COLUMN: 'To' Grid -->
      <div id="toColumn" class="lg:col-span-3 bg-neutral-950 border border-neutral-900 opacity-40 pointer-events-none p-4 flex flex-col h-[580px]">
        <div class="flex justify-between items-center border-b border-neutral-800 pb-2 mb-3">
          <span class="text-xs font-bold uppercase text-white">
            TO: DROPOFF BAY
          </span>
          <span id="toBadge" class="text-[10px] px-2 py-0.5 uppercase border border-neutral-900 text-neutral-600">
            LOCKED
          </span>
        </div>

        <div id="toGrid" class="grid grid-cols-2 gap-2 overflow-y-auto flex-1 pr-1">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- RIGHT COLUMN: Task Script Log -->
      <div id="scriptColumn" class="lg:col-span-5 bg-neutral-950 border border-neutral-800 p-4 flex flex-col justify-between h-[580px]">
        <div class="flex flex-col h-full justify-between">
          <div>
            <div class="flex justify-between items-center border-b border-neutral-800 pb-2 mb-3">
              <span id="terminalHeader" class="text-xs font-bold uppercase text-white">
                TASK SCRIPT LOG (0)
              </span>
              <div class="flex items-center gap-2">
                <button onclick="addDemoBatchTasks()" class="text-xs border border-green-500 text-green-400 hover:bg-green-950 px-2 py-0.5 uppercase font-bold cursor-pointer">
                  + ADD DEMO TASKS
                </button>
                <button id="clearBtn" class="hidden text-xs border border-neutral-800 text-neutral-400 hover:text-white px-2 py-0.5 uppercase">
                  CLEAR
                </button>
              </div>
            </div>

            <!-- Code Output Box -->
            <div id="terminalWindow" class="bg-black border border-neutral-900 p-3 h-[420px] overflow-y-auto font-mono text-xs text-neutral-300 space-y-3 leading-relaxed">
              <div class="text-neutral-600">
                Select a pickup bay on the left, then a dropoff bay in the middle to append Zenoh task commands.
              </div>
            </div>
          </div>

          <!-- Bottom Pass Script Button -->
          <div class="mt-4 pt-3 border-t border-neutral-800">
            <button id="passScriptBtn" onclick="handlePassScript()" disabled class="w-full py-3 font-bold uppercase text-xs border border-neutral-900 text-neutral-700 bg-black cursor-not-allowed">
              PASS SCRIPT TO SWARM
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    const BAYS = [
      'r1a_bay_0', 'r1a_bay_1', 'r1a_bay_2', 'r1a_bay_3', 'r1a_bay_4',
      'r1b_bay_0', 'r1b_bay_1', 'r1b_bay_2', 'r1b_bay_3', 'r1b_bay_4',
      'r2a_bay_0', 'r2a_bay_1', 'r2a_bay_2', 'r2a_bay_3', 'r2a_bay_4',
      'r2b_bay_0', 'r2b_bay_1', 'r2b_bay_2', 'r2b_bay_3', 'r2b_bay_4',
      'r3a_bay_0', 'r3a_bay_1', 'r3a_bay_2', 'r3a_bay_3', 'r3a_bay_4',
      'r3b_bay_0', 'r3b_bay_1', 'r3b_bay_2', 'r3b_bay_3', 'r3b_bay_4'
    ];

    let selectedFrom = null;
    let step = 'SELECT_FROM';
    let queuedTasks = [];

    const fromColumn = document.getElementById('fromColumn');
    const fromBadge = document.getElementById('fromBadge');
    const fromGrid = document.getElementById('fromGrid');

    const toColumn = document.getElementById('toColumn');
    const toBadge = document.getElementById('toBadge');
    const toGrid = document.getElementById('toGrid');

    const statusBadge = document.getElementById('statusBadge');
    const terminalHeader = document.getElementById('terminalHeader');
    const clearBtn = document.getElementById('clearBtn');
    const terminalWindow = document.getElementById('terminalWindow');
    const passScriptBtn = document.getElementById('passScriptBtn');

    function handleSelectFrom(bay) {
      if (step !== 'SELECT_FROM') return;
      selectedFrom = bay;
      step = 'SELECT_TO';
      render();
    }

    function handleSelectTo(toBay) {
      if (step !== 'SELECT_TO' || !selectedFrom) return;

      const taskId = `task_${Date.now().toString().slice(-6)}_${Math.floor(Math.random()*1000)}`;
      const command = `zenoh put /swarm/tasks/pool '{"msg_type": "AVAILABLE", "task_id": "${taskId}", "pickup": "${selectedFrom}", "drop": "${toBay}"}'`;

      queuedTasks.push({
        id: taskId,
        task_id: taskId,
        pickup: selectedFrom,
        drop: toBay,
        command: command,
        timestamp: new Date().toLocaleTimeString()
      });

      selectedFrom = null;
      step = 'SELECT_FROM';
      render();
    }

    function handleClear() {
      queuedTasks = [];
      render();
    }

    function addDemoBatchTasks() {
      const demoPairs = [
        { from: 'r1a_bay_0', to: 'r3b_bay_3' },
        { from: 'r3b_bay_2', to: 'r1a_bay_1' },
        { from: 'r2a_bay_1', to: 'r2b_bay_2' }
      ];
      demoPairs.forEach(pair => {
        const taskId = `task_${Date.now().toString().slice(-6)}_${Math.floor(Math.random()*1000)}`;
        const command = `zenoh put /swarm/tasks/pool '{"msg_type": "AVAILABLE", "task_id": "${taskId}", "pickup": "${pair.from}", "drop": "${pair.to}"}'`;
        queuedTasks.push({
          id: taskId,
          task_id: taskId,
          pickup: pair.from,
          drop: pair.to,
          command: command,
          timestamp: new Date().toLocaleTimeString()
        });
      });
      render();
    }

    const BAY_COORDINATES = {
      'r1a_bay_0': { x: 1, y: 4 }, 'r1a_bay_1': { x: 1, y: 6 }, 'r1a_bay_2': { x: 5, y: 4 }, 'r1a_bay_3': { x: 5, y: 6 }, 'r1a_bay_4': { x: 1, y: 4 },
      'r1b_bay_0': { x: 5, y: 4 }, 'r1b_bay_1': { x: 5, y: 6 }, 'r1b_bay_2': { x: 9, y: 4 }, 'r1b_bay_3': { x: 9, y: 6 }, 'r1b_bay_4': { x: 9, y: 4 },
      'r2a_bay_0': { x: 1, y: 6 }, 'r2a_bay_1': { x: 1, y: 8 }, 'r2a_bay_2': { x: 5, y: 6 }, 'r2a_bay_3': { x: 5, y: 8 }, 'r2a_bay_4': { x: 1, y: 8 },
      'r2b_bay_0': { x: 5, y: 6 }, 'r2b_bay_1': { x: 5, y: 8 }, 'r2b_bay_2': { x: 9, y: 6 }, 'r2b_bay_3': { x: 9, y: 8 }, 'r2b_bay_4': { x: 9, y: 8 },
      'r3a_bay_0': { x: 1, y: 8 }, 'r3a_bay_1': { x: 1, y: 10 }, 'r3a_bay_2': { x: 5, y: 8 }, 'r3a_bay_3': { x: 5, y: 10 }, 'r3a_bay_4': { x: 1, y: 10 },
      'r3b_bay_0': { x: 5, y: 10 }, 'r3b_bay_1': { x: 5, y: 12 }, 'r3b_bay_2': { x: 9, y: 10 }, 'r3b_bay_3': { x: 9, y: 12 }, 'r3b_bay_4': { x: 9, y: 12 }
    };

    function handlePassScript() {
      if (queuedTasks.length === 0) return;
      
      const payload = queuedTasks.map(t => ({
        task_id: t.task_id || t.id,
        pickup: t.pickup,
        drop: t.drop
      }));

      try {
        const existing = JSON.parse(localStorage.getItem('swarm_injected_tasks') || '[]');
        const updated = [...existing, ...payload];
        localStorage.setItem('swarm_injected_tasks', JSON.stringify(updated));
        localStorage.setItem('tourCompleted', 'true');
      } catch (err) {
        console.error('LocalStorage write error:', err);
      }

      payload.forEach(taskPayload => {
        fetch('/api/inject_task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(taskPayload)
        }).catch(err => console.error('Task injection error:', err));
      });

      // Immediate redirect to root dashboard
      window.location.href = window.location.origin + '/?runMission=true';
    }

    function render() {
      if (step === 'SELECT_FROM') {
        fromColumn.className = "lg:col-span-4 bg-neutral-950 border border-neutral-500 p-4 flex flex-col h-[580px]";
        fromBadge.className = "text-[10px] px-2 py-0.5 uppercase border border-neutral-600 text-white bg-neutral-900";
        fromBadge.innerText = "READY";

        toColumn.className = "lg:col-span-3 bg-neutral-950 border border-neutral-900 opacity-40 pointer-events-none p-4 flex flex-col h-[580px]";
        toBadge.className = "text-[10px] px-2 py-0.5 uppercase border border-neutral-900 text-neutral-600";
        toBadge.innerText = "LOCKED";

        statusBadge.innerText = "MODE: PICKUP SELECTION";
      } else {
        fromColumn.className = "lg:col-span-4 bg-neutral-950 border border-neutral-800 p-4 flex flex-col h-[580px]";
        fromBadge.className = "text-[10px] px-2 py-0.5 uppercase border border-neutral-800 text-neutral-600";
        fromBadge.innerText = "SELECTED";

        toColumn.className = "lg:col-span-3 bg-neutral-950 border border-neutral-500 p-4 flex flex-col h-[580px]";
        toBadge.className = "text-[10px] px-2 py-0.5 uppercase border border-neutral-600 text-white bg-neutral-900";
        toBadge.innerText = "READY";

        statusBadge.innerText = "MODE: DROPOFF SELECTION";
      }

      fromGrid.innerHTML = BAYS.map(bay => {
        const isSelected = selectedFrom === bay;
        return `
          <button onclick="handleSelectFrom('${bay}')"
            class="border p-2.5 text-left text-xs font-mono flex flex-col justify-between ${
              isSelected
                ? 'bg-neutral-200 text-black border-white font-bold'
                : 'bg-black border-neutral-800 hover:border-neutral-600 text-neutral-400 hover:text-white'
            }">
            <span class="text-[10px] ${isSelected ? 'text-black' : 'text-neutral-600'}">BAY</span>
            <span>${bay}</span>
          </button>
        `;
      }).join('');

      toGrid.innerHTML = BAYS.map(bay => {
        return `
          <button onclick="handleSelectTo('${bay}')"
            class="border border-neutral-800 bg-black hover:border-neutral-600 text-neutral-400 hover:text-white p-2.5 text-left text-xs font-mono flex flex-col justify-between">
            <span class="text-[10px] text-neutral-600">BAY</span>
            <span>${bay}</span>
          </button>
        `;
      }).join('');

      terminalHeader.innerText = `TASK SCRIPT LOG (${queuedTasks.length})`;
      if (queuedTasks.length > 0) {
        clearBtn.classList.remove('hidden');
        terminalWindow.innerHTML = queuedTasks.map((t, idx) => `
          <div class="border-b border-neutral-900 pb-2">
            <div class="text-neutral-600 text-[10px]">
              Task ${idx + 1} [${t.timestamp}] ${t.pickup} -&gt; ${t.drop}
            </div>
            <div class="text-neutral-200 break-all">
              ${t.command}
            </div>
          </div>
        `).join('');

        passScriptBtn.removeAttribute('disabled');
        passScriptBtn.disabled = false;
        passScriptBtn.className = "w-full py-3 font-bold uppercase text-xs border border-white bg-neutral-200 text-black hover:bg-white cursor-pointer";
      } else {
        clearBtn.classList.add('hidden');
        terminalWindow.innerHTML = `
          <div class="text-neutral-600">
            Select a pickup bay on the left, then a dropoff bay in the middle to append Zenoh task commands.
          </div>
        `;
        passScriptBtn.setAttribute('disabled', 'true');
        passScriptBtn.disabled = true;
        passScriptBtn.className = "w-full py-3 font-bold uppercase text-xs border border-neutral-900 text-neutral-700 bg-black cursor-not-allowed";
      }

      terminalWindow.scrollTop = terminalWindow.scrollHeight;
      renderTourStep();
    }

    clearBtn.addEventListener('click', handleClear);
    passScriptBtn.addEventListener('click', handlePassScript);

    // ════════════════════════════════════════════
    // ONBOARDING TOUR (STEPS 6-8)
    // ════════════════════════════════════════════
    let tourStep = 6;

    const TOUR_STEPS_CONFIG = [
      { step: 6, title: 'PICKUP BAY', content: 'PICKUP: Select the starting bay to load cargo.', targetId: 'fromColumn' },
      { step: 7, title: 'DROPOFF BAY', content: 'DROPOFF: Select the destination bay.', targetId: 'toColumn' },
      { step: 8, title: 'TASK SCRIPT', content: 'TASK SCRIPT: Review the queue and broadcast the job to the edge nodes!', targetId: 'scriptColumn' }
    ];

    function renderTourStep() {
      // Remove previous highlights
      [fromColumn, toColumn, document.getElementById('scriptColumn')].forEach(el => {
        if (el) {
          el.style.position = '';
          el.style.zIndex = '';
          el.style.outline = '';
          el.style.boxShadow = '';
        }
      });

      const backdrop = document.getElementById('tourBackdrop');
      const tooltip = document.getElementById('tourTooltip');

      if (tourStep >= 6 && tourStep <= 8) {
        if (backdrop) backdrop.style.display = 'block';
        if (tooltip) tooltip.style.display = 'block';

        const cfg = TOUR_STEPS_CONFIG.find(c => c.step === tourStep);
        if (cfg) {
          document.getElementById('tourStepTitle').innerText = `TOUR STEP ${cfg.step} OF 8: ${cfg.title}`;
          document.getElementById('tourStepProgress').innerText = `[${cfg.step}/8]`;
          document.getElementById('tourStepContent').innerText = cfg.content;

          const targetEl = document.getElementById(cfg.targetId);
          if (targetEl) {
            targetEl.style.position = 'relative';
            targetEl.style.zIndex = '50';
            targetEl.style.outline = '2px solid #22c55e';
            targetEl.style.boxShadow = '0 0 15px rgba(34, 197, 94, 0.5)';
            targetEl.style.opacity = '1';
            targetEl.style.pointerEvents = 'auto';
          }
        }
      } else {
        if (backdrop) backdrop.style.display = 'none';
        if (tooltip) tooltip.style.display = 'none';
      }
    }

    function handleTourNext() {
      if (tourStep >= 8) {
        tourStep = 9;
        renderTourStep();
      } else {
        tourStep++;
        renderTourStep();
      }
    }

    function handleTourPrev() {
      if (tourStep === 6) {
        window.location.href = window.location.origin + '/?tourStep=5';
      } else if (tourStep > 6) {
        tourStep--;
        renderTourStep();
      }
    }

    function handleTourSkip() {
      tourStep = 9;
      localStorage.setItem('tourCompleted', 'true');
      renderTourStep();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const stepParam = params.get('tourStep');
      if (stepParam !== null) {
        tourStep = parseInt(stepParam, 10) || 6;
      } else {
        tourStep = 6;
      }
      render();
    });
  </script>

  <!-- ── DARK BACKDROP OVERLAY ── -->
  <div id="tourBackdrop" style="display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.85); z-index: 40; pointer-events: none;"></div>

  <!-- ── STEPS 6-8: BRUTALIST TOUR TOOLTIP COMPONENT ── -->
  <div id="tourTooltip" style="display: none; position: fixed; bottom: 32px; right: 32px; z-index: 50; max-width: 420px; width: 100%; background-color: #000000; border: 2px solid #22c55e; padding: 16px; font-family: monospace; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262626; padding-bottom: 8px; margin-bottom: 12px;">
      <span id="tourStepTitle" style="font-size: 11px; font-weight: bold; color: #4ade80; text-transform: uppercase;">TOUR STEP 6 OF 8</span>
      <span id="tourStepProgress" style="font-size: 10px; color: #737373; font-weight: bold;">[6/8]</span>
    </div>
    <p id="tourStepContent" style="font-size: 12px; color: #e5e5e5; text-transform: uppercase; line-height: 1.5; margin-bottom: 16px;"></p>
    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid #171717;">
      <button onclick="handleTourSkip()" style="font-size: 11px; color: #737373; text-transform: uppercase; font-weight: bold; background: transparent; border: none; cursor: pointer; font-family: monospace;">[ SKIP ]</button>
      <div style="display: flex; gap: 8px;">
        <button id="tourPrevBtn" onclick="handleTourPrev()" style="font-size: 11px; font-weight: bold; padding: 6px 12px; text-transform: uppercase; border: 1px solid #404040; background-color: #0a0a0a; color: #d4d4d4; cursor: pointer; font-family: monospace;">[ &lt;- PREV ]</button>
        <button onclick="handleTourNext()" style="font-size: 11px; font-weight: bold; padding: 6px 16px; text-transform: uppercase; background-color: #22c55e; color: #000000; border: 1px solid #4ade80; cursor: pointer; font-family: monospace;">[ NEXT -&gt; ]</button>
      </div>
    </div>
  </div>
</body>
</html>
